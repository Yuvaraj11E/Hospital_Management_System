<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Patient Saved</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        .message {
            font-size: 24px;
            color: green;
            margin-bottom: 20px;
        }
        .back-btn {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .back-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="message" th:text="${message}">PATIENT SAVED SUCCESSFULLY</div>
    <a href="/addpatient" class="back-btn">Add Another Patient</a>
    <a href="/home" class="back-btn">Click Back To Home</a>

</body>
</html>
